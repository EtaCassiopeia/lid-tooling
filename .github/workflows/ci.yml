name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.kind }}

      - name: cargo fmt --check
        if: matrix.kind == 'fmt'
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        if: matrix.kind == 'clippy'
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        if: matrix.kind == 'test'
        run: cargo test --workspace

  vscode-extension:
    name: VS Code extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension (smoke test)
        run: npx vsce package --skip-license

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: lid-vsix
          path: extensions/vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
