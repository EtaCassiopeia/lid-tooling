name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            vsce_target: darwin-arm64
            ext: ''
            archive: tar.gz
            sha_cmd: shasum -a 256
          - os: macos-14
            target: x86_64-apple-darwin
            vsce_target: darwin-x64
            ext: ''
            archive: tar.gz
            sha_cmd: shasum -a 256
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vsce_target: linux-x64
            ext: ''
            archive: tar.gz
            sha_cmd: sha256sum
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            vsce_target: linux-arm64
            ext: ''
            archive: tar.gz
            sha_cmd: sha256sum
            use_cross: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            vsce_target: win32-x64
            ext: .exe
            archive: zip
            sha_cmd: sha256sum

    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # BSD sed (macOS) requires -i '' ; GNU sed (Linux/Windows) accepts -i ''
          sed -i '' "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" Cargo.toml 2>/dev/null || \
            sed -i  "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" Cargo.toml
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('extensions/vscode/package.json'));
            p.version = '${VERSION}';
            fs.writeFileSync('extensions/vscode/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          sed -i '' "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" extensions/intellij/build.gradle.kts 2>/dev/null || \
            sed -i  "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" extensions/intellij/build.gradle.kts

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (ARM64 cross-compilation)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binaries
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} --bin lidc --bin lid-lsp --bin lid-mcp
          else
            cargo build --release --target ${{ matrix.target }} --bin lidc --bin lid-lsp --bin lid-mcp
          fi

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          base="lid-${ref}-${{ matrix.target }}"
          bin_dir="target/${{ matrix.target }}/release"
          mkdir -p "dist/${base}"

          cp "${bin_dir}/lidc${{ matrix.ext }}"    "dist/${base}/"
          cp "${bin_dir}/lid-lsp${{ matrix.ext }}" "dist/${base}/"
          cp "${bin_dir}/lid-mcp${{ matrix.ext }}" "dist/${base}/"
          cp README.md LICENSE-MIT LICENSE-APACHE  "dist/${base}/"

          # Standalone binaries — used by install.sh, install.ps1, and
          # the Homebrew formula without needing to unpack the full archive.
          for bin in lidc lid-lsp lid-mcp; do
            cp "${bin_dir}/${bin}${{ matrix.ext }}" \
               "dist/${bin}-${{ matrix.target }}${{ matrix.ext }}"
            ( cd dist && ${{ matrix.sha_cmd }} \
                "${bin}-${{ matrix.target }}${{ matrix.ext }}" \
                > "${bin}-${{ matrix.target }}${{ matrix.ext }}.sha256" )
          done

          # Create archive (zip for Windows, tar.gz for everything else).
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            ( cd dist && 7z a "${base}.zip" "${base}" > /dev/null )
            ( cd dist && ${{ matrix.sha_cmd }} "${base}.zip" > "${base}.zip.sha256" )
          else
            tar -czf "dist/${base}.tar.gz" -C dist "${base}"
            ( cd dist && ${{ matrix.sha_cmd }} "${base}.tar.gz" > "${base}.tar.gz.sha256" )
          fi

          ls -la dist/

      # ── VS Code extension ────────────────────────────────────────────────

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Compile extension
        working-directory: extensions/vscode
        run: npm run compile

      - name: Bundle lid-lsp into extension
        shell: bash
        run: |
          mkdir -p extensions/vscode/server
          cp "target/${{ matrix.target }}/release/lid-lsp${{ matrix.ext }}" \
             "extensions/vscode/server/lid-lsp${{ matrix.ext }}"

      - name: Package platform-specific VSIX
        working-directory: extensions/vscode
        run: >
          npx @vscode/vsce package
          --target ${{ matrix.vsce_target }}
          --out lid-vscode-${{ matrix.vsce_target }}.vsix
          --skip-license

      - name: Move VSIX to dist
        shell: bash
        run: |
          cp "extensions/vscode/lid-vscode-${{ matrix.vsce_target }}.vsix" \
             "dist/lid-vscode-${{ matrix.vsce_target }}.vsix"

      # ── IntelliJ plugin ──────────────────────────────────────────────────

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Bundle lid-lsp into IntelliJ plugin
        shell: bash
        run: |
          mkdir -p extensions/intellij/server
          cp "target/${{ matrix.target }}/release/lid-lsp${{ matrix.ext }}" \
             "extensions/intellij/server/lid-lsp${{ matrix.ext }}"

      - name: Build IntelliJ plugin
        working-directory: extensions/intellij
        run: ./gradlew buildPlugin --no-daemon

      - name: Move IntelliJ plugin zip to dist
        shell: bash
        run: |
          find extensions/intellij/build/distributions -name '*.zip' \
            -exec cp {} "dist/lid-intellij-${{ matrix.vsce_target }}.zip" \;

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.vsix
            dist/*.sha256
            dist/lidc-*
            dist/lid-lsp-*
            dist/lid-mcp-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' \
               -o -name '*.sha256' \
               -o -name 'lidc-*' -o -name 'lid-lsp-*' -o -name 'lid-mcp-*' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ── Publish VS Code extension to marketplace ─────────────────────────────────

  publish-extension:
    name: Publish VS Code extension
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect VSIXs
        run: |
          mkdir -p vsix
          find artifacts -name '*.vsix' -exec cp {} vsix/ \;
          ls vsix/

      - name: Publish to VS Code Marketplace
        run: |
          npm install -g @vscode/vsce
          for vsix in vsix/*.vsix; do
            out=$(vsce publish --pat "${{ secrets.VSCE_PAT }}" --packagePath "$vsix" 2>&1) && echo "$out" || {
              if echo "$out" | grep -q "already exists"; then
                echo "Already published: $out"
              else
                echo "$out"; exit 1
              fi
            }
          done

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "OVSX_PAT not configured, skipping Open VSX publish"
            exit 0
          fi
          npm install -g ovsx
          for vsix in vsix/*.vsix; do
            ovsx publish "$vsix" --pat "${OVSX_PAT}"
          done

  # ── Publish IntelliJ plugin to JetBrains Marketplace ────────────────────────
  #
  # Builds a single fat plugin zip containing all four platform lid-lsp binaries
  # (the plugin's platformBinaryName() picks the right one at runtime).
  # Requires four GitHub secrets:
  #   JETBRAINS_MARKETPLACE_TOKEN  – obtain from plugins.jetbrains.com
  #   CERTIFICATE_CHAIN            – PEM cert chain (see README.md § IntelliJ signing)
  #   PRIVATE_KEY                  – PEM private key
  #   PRIVATE_KEY_PASSWORD         – private key passphrase (may be empty)

  publish-intellij:
    name: Publish IntelliJ plugin
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" extensions/intellij/build.gradle.kts

      - name: Bundle all platform lid-lsp binaries
        shell: bash
        run: |
          mkdir -p extensions/intellij/server
          # Each build matrix job uploaded lid-lsp-<target>[.exe] as a standalone
          # binary. Collect all four so the fat plugin zip works on every OS.
          find artifacts -name 'lid-lsp-*' ! -name '*.sha256' \
            -exec cp {} extensions/intellij/server/ \;
          chmod +x extensions/intellij/server/lid-lsp-* 2>/dev/null || true
          ls -la extensions/intellij/server/

      - name: Sign and publish plugin
        working-directory: extensions/intellij
        shell: bash
        run: |
          out=$(./gradlew signPlugin publishPlugin --no-daemon 2>&1) && echo "$out" || {
            if echo "$out" | grep -q "already contains version"; then
              echo "Already published: $(echo "$out" | grep 'already contains version')"
            else
              echo "$out"; exit 1
            fi
          }
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

  # ── Update Homebrew tap ───────────────────────────────────────────────────────

  update-homebrew-tap:
    name: Update Homebrew tap
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract checksums and build formula
        id: formula
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"   # e.g. v0.2.3

          # Pull the first token (the hex digest) from each .sha256 file.
          # The files contain "<digest>  <filename>" (sha256sum format).
          arm64_sum=$(awk '{print $1}' \
            "$(find artifacts -name "lid-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")")
          x86_sum=$(awk '{print $1}' \
            "$(find artifacts -name "lid-${VERSION}-x86_64-apple-darwin.tar.gz.sha256")")
          linux_sum=$(awk '{print $1}' \
            "$(find artifacts -name "lid-${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256")")
          linux_arm64_sum=$(awk '{print $1}' \
            "$(find artifacts -name "lid-${VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256")")

          BASE="https://github.com/EtaCassiopeia/lid-tooling/releases/download/${VERSION}"

          cat > formula.rb <<RUBY
          class LidTooling < Formula
            desc "CLI and MCP server for Linked-Intent Development"
            homepage "https://github.com/EtaCassiopeia/lid-tooling"
            version "${VERSION#v}"
            license "MIT OR Apache-2.0"

            on_macos do
              on_arm do
                url "${BASE}/lid-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${arm64_sum}"
              end
              on_intel do
                url "${BASE}/lid-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${x86_sum}"
              end
            end

            on_linux do
              on_intel do
                url "${BASE}/lid-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_sum}"
              end
              on_arm do
                url "${BASE}/lid-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_arm64_sum}"
              end
            end

            def install
              bin.install "lidc"
              bin.install "lid-mcp"
              bin.install "lid-lsp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/lidc --version")
            end
          end
          RUBY

          echo "Generated formula:"
          cat formula.rb

      - name: Push updated formula to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured, skipping Homebrew tap update"
            exit 0
          fi
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gh repo clone EtaCassiopeia/homebrew-lid tap
          git -C tap remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/EtaCassiopeia/homebrew-lid.git"
          cp formula.rb tap/Formula/lid-tooling.rb
          cd tap
          git add Formula/lid-tooling.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update lid-tooling to ${GITHUB_REF_NAME}"
          git push
