name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            vsce_target: darwin-arm64
            ext: ''
            archive: tar.gz
            sha_cmd: shasum -a 256
          - os: macos-13
            target: x86_64-apple-darwin
            vsce_target: darwin-x64
            ext: ''
            archive: tar.gz
            sha_cmd: shasum -a 256
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vsce_target: linux-x64
            ext: ''
            archive: tar.gz
            sha_cmd: sha256sum
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vsce_target: win32-x64
            ext: .exe
            archive: zip
            sha_cmd: sha256sum

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin lidc --bin lid-lsp

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          base="lid-${ref}-${{ matrix.target }}"
          bin_dir="target/${{ matrix.target }}/release"
          mkdir -p "dist/${base}"

          cp "${bin_dir}/lidc${{ matrix.ext }}"    "dist/${base}/"
          cp "${bin_dir}/lid-lsp${{ matrix.ext }}" "dist/${base}/"
          cp README.md LICENSE-MIT LICENSE-APACHE  "dist/${base}/"

          # Standalone lid-lsp binary — consumed by the VSIX bundler and
          # Homebrew formula without needing to unpack the full archive.
          cp "${bin_dir}/lid-lsp${{ matrix.ext }}" \
             "dist/lid-lsp-${{ matrix.target }}${{ matrix.ext }}"

          # Create archive (zip for Windows, tar.gz for everything else).
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            ( cd dist && zip -r "${base}.zip" "${base}" )
            ( cd dist && ${{ matrix.sha_cmd }} "${base}.zip" > "${base}.zip.sha256" )
          else
            tar -czf "dist/${base}.tar.gz" -C dist "${base}"
            ( cd dist && ${{ matrix.sha_cmd }} "${base}.tar.gz" > "${base}.tar.gz.sha256" )
          fi

          # Checksum for the standalone lid-lsp binary.
          ( cd dist && ${{ matrix.sha_cmd }} \
              "lid-lsp-${{ matrix.target }}${{ matrix.ext }}" \
              > "lid-lsp-${{ matrix.target }}${{ matrix.ext }}.sha256" )

          ls -la dist/

      # ── VS Code extension ────────────────────────────────────────────────

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Compile extension
        working-directory: extensions/vscode
        run: npm run compile

      - name: Bundle lid-lsp into extension
        shell: bash
        run: |
          mkdir -p extensions/vscode/server
          cp "target/${{ matrix.target }}/release/lid-lsp${{ matrix.ext }}" \
             "extensions/vscode/server/lid-lsp${{ matrix.ext }}"

      - name: Package platform-specific VSIX
        working-directory: extensions/vscode
        run: >
          npx @vscode/vsce package
          --target ${{ matrix.vsce_target }}
          --out lid-vscode-${{ matrix.vsce_target }}.vsix
          --skip-license

      - name: Move VSIX to dist
        shell: bash
        run: |
          cp "extensions/vscode/lid-vscode-${{ matrix.vsce_target }}.vsix" \
             "dist/lid-vscode-${{ matrix.vsce_target }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.vsix
            dist/*.sha256
            dist/lid-lsp-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' \
               -o -name '*.sha256' -o -name 'lid-lsp-*' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
