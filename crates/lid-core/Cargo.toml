[package]
name = "lid-core"
description = "Core engine for LID (Linked-Intent Development) tooling: parsers, model, and coherence checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tempfile = "3"
