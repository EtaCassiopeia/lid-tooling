<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background: dark navy matching galleryBanner color -->
  <rect width="128" height="128" rx="22" fill="#0f0f1a"/>

  <!-- Arrow-document pentagon: the document IS the arrow, conveying intent with direction -->
  <path d="M 14 33 L 80 33 L 116 64 L 80 95 L 14 95 Z"
        fill="#151f38" stroke="#4b8ef1" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left spine bar (document bookmark accent) -->
  <rect x="14" y="33" width="5" height="62" rx="2.5" fill="#4b8ef1"/>

  <!-- Spec / intent text lines inside the arrow body -->
  <rect x="27" y="47" width="44" height="4" rx="2" fill="#93c5fd" opacity="0.90"/>
  <rect x="27" y="58" width="38" height="4" rx="2" fill="#93c5fd" opacity="0.72"/>
  <rect x="27" y="69" width="40" height="4" rx="2" fill="#93c5fd" opacity="0.72"/>
  <rect x="27" y="80" width="28" height="4" rx="2" fill="#93c5fd" opacity="0.50"/>

  <!-- Small checkmark at arrowhead tip area, representing verified implementation -->
  <path d="M 86 58 L 91 65 L 103 52"
        stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        fill="none" opacity="0.85"/>
</svg>
